<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Enam</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0d1b38;
      color: #ffffff;
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }

    .box {
      max-width: 620px;
    }

    h1 {
      font-size: 52px;
      margin: 0 0 12px;
    }

    p {
      color: #cbd7e7;
      font-size: 18px;
      margin-bottom: 28px;
    }

    a {
      display: inline-block;
      background: #f5831f;
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Page Not Found</h1>
    <p>The page you are looking for is not available. Return to the homepage.</p>
    <a href="/">Go To Homepage</a>
  </div>
</body>
</html>
