 <div class="notice"><strong>Interpretation:</strong> This is an independent CMDB self assessment. It does not reproduce the native ServiceNow CMDB Health Dashboard score and does not certify CSDM conformance, data accuracy or operational readiness. Self ratings should be validated using instance evidence before formal decisions.</div>
 <div class="metrics"><div class="card"><div class="eyebrow">Composite maturity score</div><div class="metric sm">${scoreText}</div></div><div class="card"><div class="eyebrow">Criteria scored</div><div class="metric sm">${r.assessed} / ${r.applicable}</div><div class="tiny muted">${pct(r.coverage)} of applicable checks</div></div><div class="card"><div class="eyebrow">Measured responses</div><div class="metric sm">${pct(r.measuredCoverage)}</div><div class="tiny muted">Of applicable checks</div></div><div class="card"><div class="eyebrow">Respondent reviewed evidence</div><div class="metric sm">${pct(r.reviewCoverage)}</div><div class="tiny muted">Not independently audited</div></div></div>
 <div class="grid2"><div class="card"><h2>Performance by dimension</h2>${r.domains.map(d=>bar(d.name,d.score,d.weight,d.coverage)).join('')}</div><div class="card"><h2>What the result means</h2><p>${esc(interpretation)}</p><p class="small"><strong>${r.missing} not assessed</strong>, ${r.excluded} justified N/A responses. Missing checks do not contribute zero but reduce coverage.</p><p class="small muted">Scope: ${esc(m.scope||'Not specified')}<br>Release: ${esc(m.release||'Not specified')}<br>Period: ${esc(m.period||'Not specified')}<br>Methodology: ${esc(cfg.scoringVersion)}</p>${state.demo?'<p class="pill danger">Synthetic example, not a real assessment</p>':''}</div></div>
 <section class="card" style="margin-top:16px"><h2>Priority areas for review</h2>${top.length?`<ol class="note-list">${top.map(x=>`<li><strong>${esc(x.id)}:</strong> ${esc(x.remediation)} <span class="muted small">(${pct(x.score)})</span></li>`).join('')}</ol>`:'<p class="muted">No scored gaps recorded. Review evidence and applicable exclusions before concluding that no work is required.</p>'}<p class="tiny muted">Sorted by lowest scored checks. This is a first pass prioritisation, not a cost or risk ranked remediation programme. Also review unassessed and excluded checks separately.</p></section>
 <section class="card report-break" style="margin-top:16px"><h2>Criterion findings</h2>${reportRows(r.rows)}</section>
 <div class="actions no-print">${btn('Print or Save as PDF','print','btn')}${btn('Save assessment JSON','save')}${btn('Return to questions','questions')}${btn('Import another assessment','import')}${btn('Clear assessment','reset','btn warn')}</div><p class="small muted">Independent educational research preview by Enamul Haque. The methodology is source informed, but not endorsed or certified by ServiceNow.</p></section>`;
}
function methodology(){return `<section><p class="eyebrow">Research preview methodology</p><h1>What this assessment measures</h1><p class="lead muted">An independent self assessment of the quality and management maturity of your ServiceNow CMDB across four equally weighted dimensions.</p>
 <div class="grid2"><div class="card"><h2>Scoring</h2><p><strong>Positive rate:</strong> 100 × passing divided by eligible.</p><p><strong>Adverse rate:</strong> 100 × (1 minus adverse divided by eligible).</p><p><strong>Evidence supported rating:</strong> 0 to 4 multiplied by 25.</p><p><strong>Indicative self rating:</strong> 0 to 4 multiplied by 25 and explicitly marked as an estimate.</p><p><strong>Domain:</strong> average of scored applicable checks.</p><p><strong>Overall:</strong> average of four scored domain results. Missing domains do not count as zero, but prevent a maturity band.</p></div>
 <div class="card"><h2>Interpretation and limits</h2><p>The descriptive maturity bands are <strong>Initial</strong> (0 to 19.9), <strong>Developing</strong> (20 to 39.9), <strong>Establishing</strong> (40 to 59.9), <strong>Managed</strong> (60 to 79.9) and <strong>Optimised</strong> (80 to 100). They are project defined labels, not externally calibrated benchmarks.</p><p>A band is shown only when at least 80% of applicable criteria have scores and all four domains have evidence. This 80% rule is a presentation convention, not a vendor threshold.</p><p>Not assessed lowers coverage and is not scored. A justified N/A is excluded. A respondent marked evidence review is not independent validation.</p></div></div>
 <div class="card" style="margin:16px 0"><h2>How this differs from native CMDB Health</h2><p>ServiceNow CMDB Health offers configured completeness, correctness and compliance KPIs, alongside relationship health diagnostics. This independent questionnaire also considers CSDM, governance and operational maturity. It does not read the instance or duplicate the vendor score. Actual health results depend on installed applications, configurations, rules and scheduled jobs.</p><p>Use this assessment to guide discussion and improvement priorities. Refer to native CMDB Health and Data Foundations for technical measurements.</p></div>
 <div class="card"><h2>Official documentation</h2><p class="small muted">The linked documents support relevant platform concepts and metrics, not the independent scoring algorithm or maturity bands.</p>${Object.entries(cfg.sources).map(([code,s])=>`<div class="source-item"><strong>${esc(code)}</strong>: ${esc(s.name)}<br><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a></div>`).join('')}</div><div class="actions">${btn('Start assessment','questions','btn')}${btn('Back to overview','home')}</div></section>`;}
function render(){app.innerHTML=state.view==='home'?overview():state.view==='questions'?questions():state.view==='results'?results():methodology();document.querySelectorAll('.topnav button').forEach(b=>b.classList.toggle('active',b.dataset.action===(state.view==='home'?'home':state.view==='questions'?'questions':state.view==='methodology'?'methodology':'none')));}
function refreshCompletion(){if(state.view!=='questions')return;const count=totalComplete(),num=inStage(state.domainIndex).length,done=completed(state.domainIndex);
 const el=document.querySelector('.completion-indicator strong');if(el)el.textContent=count+' / 23';
 const bar=document.querySelector('.assessment-page>.progress>span');if(bar)bar.style.width=(count/23*100)+'%';
 document.querySelector('.assessment-page>.progress')?.setAttribute('aria-valuenow',String(count));
 const meta=document.querySelectorAll('.stage-bar span');if(meta[0])meta[0].innerHTML=`<strong>Stage ${state.domainIndex+1} of 4</strong> · ${done} of ${num} recorded`;if(meta[1])meta[1].textContent=stageComplete(state.domainIndex)?'Stage complete':'All responses required to continue';
 document.querySelectorAll('.stage').forEach((s,i)=>{const n=inStage(i).length,k=completed(i),open=canVisit(i);s.disabled=!open;s.classList.toggle('complete',k===n);s.querySelector('.step-circle').textContent=k===n?'✓':i+1;s.querySelector('.stage-content small').textContent=`${k} of ${n} answered`;s.querySelector('.step-lock').textContent=open?'':'🔒';});
 inStage(state.domainIndex).forEach(c=>{const q=document.getElementById('question_'+c.id);if(!q)return;const done=complete(c,currentAnswer(c.id)),tag=q.querySelector('.question-tags .answered');if(done&&!tag){const span=document.createElement('span');span.className='tag answered';span.textContent='Answered ✓';q.querySelector('.question-tags').appendChild(span);}if(!done&&tag)tag.remove();if(done)q.classList.remove('is-incomplete');});
}
function next(){const i=state.domainIndex;if(!stageComplete(i)){state.validationStage=i;render();feedback('Please record a response for every question in this stage. Choose Not assessed when evidence is unavailable.',true);const first=inStage(i).find(c=>!complete(c,currentAnswer(c.id)));document.getElementById('question_'+first.id)?.scrollIntoView({block:'center'});return;}
 if(i===cfg.domains.length-1)go('results');else go('questions',i+1);
}
function openStage(i){if(canVisit(i))go('questions',i);else feedback('Complete the earlier stages before opening this stage.',true);}
function save(){const payload={format:'eh-cmdb-health-maturity',schemaVersion:1,version:cfg.version,savedAt:new Date().toISOString(),meta:state.meta,answers:state.answers,syntheticExample:state.demo};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CMDB_Health_Maturity_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);feedback('JSON saved to your device. No answer data was uploaded.');}
function example(){state.demo=true;state.meta={organisation:'SYNTHETIC EXAMPLE',release:'Sample environment',scope:'Illustrative service estate',period:'Sample demonstration'};
 for(const c of cfg.criteria){let a;if(c.metricType==='maturity')a={mode:'measured',maturity:2,assurance:'verified'};else a={mode:'measured',numerator:c.metricType==='lower'?12:75,denominator:100,assurance:'verified'};state.answers[c.id]=a;}
 state.answers.C10.numerator=45;state.answers.C13.numerator=48;state.answers.C21.numerator=60;go('results');}
function importSnapshot(file){if(!file)return;if(file.size>2_000_000){feedback('JSON file exceeds 2 MB.',true);return;}file.text().then(raw=>{const obj=JSON.parse(raw);if(obj.format!=='eh-cmdb-health-maturity'||obj.schemaVersion!==1||obj.version!==cfg.version||typeof obj.answers!=='object'||!obj.answers)throw Error('This is not a compatible CMDB Health and Maturity assessment JSON file. Older AI readiness files are intentionally not imported automatically.');
 const ids=new Set(cfg.criteria.map(c=>c.id)),next={};for(const [id,a] of Object.entries(obj.answers)){if(!ids.has(id)||typeof a!=='object'||!a)continue;const b={};for(const k of ['mode','maturity','numerator','denominator','assurance','naReason','note'])if(a[k]!==undefined){b[k]=String(a[k]).slice(0,['note','naReason'].includes(k)?3000:50);}if(['unknown','na','self','measured'].includes(b.mode))next[id]=b;}
 state.answers=next;for(const k of Object.keys(state.meta))state.meta[k]=String(obj.meta?.[k]||'').slice(0,200);state.demo=!!obj.syntheticExample;const missing=cfg.domains.findIndex((_,i)=>!stageComplete(i));go(missing<0?'results':'questions',missing<0?0:missing);feedback('Assessment imported.');
 }).catch(e=>feedback('Unable to load assessment: '+e.message,true));}
document.addEventListener('click',e=>{const t=e.target.closest('[data-help-toggle]');if(t){e.preventDefault();const w=t.closest('.help-wrap'),o=w.classList.toggle('open');t.setAttribute('aria-expanded',String(o));return;}
 const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();switch(el.dataset.action){case 'home':go('home');break;case 'questions':go('questions');break;case 'results':allComplete()?go('results'):go('questions',cfg.domains.findIndex((_,i)=>!stageComplete(i)));break;case 'methodology':go('methodology');break;case 'next':next();break;case 'prev':go('questions',Math.max(0,state.domainIndex-1));break;case 'stage':openStage(Number(el.dataset.stage));break;case 'save':save();break;case 'demo':example();break;case 'print':window.print();break;case 'reset':if(confirm('Clear your current answers? Export JSON first if needed.')){state.answers={};state.demo=false;go('home');}break;case 'import':{let f=document.getElementById('json-import');if(!f){f=document.createElement('input');f.type='file';f.id='json-import';f.hidden=true;f.accept='.json,application/json';f.addEventListener('change',e=>{importSnapshot(e.target.files[0]);e.target.value='';});document.body.appendChild(f);}f.click();break;}}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.meta){state.meta[el.dataset.meta]=el.value;return;}if(el.dataset.id&&el.dataset.field){const a=state.answers[el.dataset.id]||(state.answers[el.dataset.id]={});a[el.dataset.field]=el.value;refreshCompletion();}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.id&&el.dataset.field){const a=state.answers[el.dataset.id]||(state.answers[el.dataset.id]={});a[el.dataset.field]=el.value;if(el.dataset.field==='mode'){const y=window.scrollY;render();window.scrollTo(0,y);}else refreshCompletion();}});
render();
})();

</script></body></html>
